name = "polski-bot"
main = "src/index.ts"
compatibility_date = "2026-08-22"

[vars]
OPENAI_MODEL = "gpt-5-mini"
DAILY_LIMIT_PER_CHAT = "150"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionObject"]

[observability]
enabled = true

[build]
command = "npm run topics"
watch_dir = "topics"
